<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes from underground</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
</head>

<body>
  <iframe id="youtube-audio" width="1" height="1" src="" frameborder="0" allow="autoplay; encrypted-media"
    style="position: absolute; opacity: 0; pointer-events: none;">
  </iframe>

  <canvas id="ascii-canvas"></canvas>

  <div class="container">
    <div class="title">Notes from_<br>underground</div>
    <div class="notes" id="notes-container"></div>
  </div>

  <script src="index.js"></script>
  <script>
    const song = '6Ke2JsJM0rc';

    function startMusic() {
      const audioFrame = document.getElementById('youtube-audio');
      if (audioFrame && !audioFrame.src) {
        audioFrame.src = `https://www.youtube.com/embed/${song}?autoplay=1&loop=1&playlist=${song}`;
      }

      document.removeEventListener('click', startMusic);
      document.removeEventListener('keydown', startMusic);
      document.removeEventListener('scroll', startMusic);
    }

    document.addEventListener('click', startMusic);
    document.addEventListener('keydown', startMusic);
    document.addEventListener('scroll', startMusic);
  </script>
</body>

</html>
